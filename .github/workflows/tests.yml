name: Playwright AI Framework Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: npx -y playwright@1.55.0 install --with-deps chromium

      - name: Run UI and API tests
        run: >
          mvn test
          -Dheadless=true
          -Dtest="FirstPlaywrightTest,LoginTest,APITest,CreateUserTest,DeleteUserTest,GetUserByQueryTest,UpdateUserTest,UserApiTest,UserQueryTest"